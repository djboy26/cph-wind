name: CI

# Full pre-merge gate. Build is included deliberately: `tsc -b && vite build` catches
# breakage that `test` and `tsc --noEmit` miss (e.g. a stray key in vite.config.ts).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Map data is pinned by data.lock.json and fetched from R2 (two tests read it);
      # cached per lock, so it downloads once per data version.
      - uses: actions/cache@v4
        with:
          path: |
            public/data
          key: data-${{ hashFiles('data.lock.json') }}
      - run: npm run data:pull
      - run: npm run lint
      - run: npm test
      - run: npm run build
